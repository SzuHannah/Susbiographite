[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biographite-repro"
version = "1.0.0"
description = "Reproducible biographite TEA/LCA/sLCC foreground-data and custom-factor workflow"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "openpyxl>=3.1",
  "numpy-financial>=1.0",
]

[tool.setuptools.packages.find]
include = ["graphite_sus*"]

[tool.setuptools.package-data]
graphite_sus = ["data/**/*.csv", "data/**/*.xlsx", "data/**/*.json"]
